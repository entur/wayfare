name: Python FastAPI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "bffs/python-fastapi/**"
      - ".github/workflows/python-fastapi.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bffs/python-fastapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: bffs/python-fastapi/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
