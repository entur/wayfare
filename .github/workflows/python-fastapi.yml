name: Python FastAPI

on:
  pull_request:
    paths:
      - "bffs/python-fastapi/**"
      - ".github/workflows/python-fastapi.yml"
  push:
    branches: [main]
    paths:
      - "bffs/python-fastapi/**"
      - ".github/workflows/python-fastapi.yml"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bffs/python-fastapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: bffs/python-fastapi/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
