name: reisefrihet contract sync

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bffs/reisefrihet-fastify
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: bffs/reisefrihet-fastify/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:generate
      - id: diff
        run: |
          if git diff --quiet -- src/generated/reisefrihet.ts; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open an issue if the staging spec has drifted
        if: steps.diff.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "reisefrihet staging spec has drifted from src/generated/reisefrihet.ts"
          ISSUE_BODY: |
            The live OpenAPI spec at https://api.staging.entur.io/reisefrihet/v3/api-docs no
            longer matches the committed `bffs/reisefrihet-fastify/src/generated/reisefrihet.ts`.

            Regenerate it locally:

                cd bffs/reisefrihet-fastify
                pnpm contract:generate

            Then run `pnpm check` and fix any type errors it surfaces in `src/mappers.ts` or
            its tests (newly required or removed fields are the usual cause) before committing.
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$ISSUE_TITLE\"" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Drift issue already open, skipping"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$ISSUE_BODY"
