name: Deploy Wayfare dev

on:
  push:
    branches:
      - main
    paths:
      - "clients/tanstack-start/**"
      - "helm/wayfare/**"
      - ".github/workflows/tanstack-start-deploy-dev.yml"

concurrency:
  group: deploy-wayfare-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
    with:
      dockerfile: clients/tanstack-start/Dockerfile

  helm-lint:
    name: Helm lint
    strategy:
      matrix:
        environment: [dev, tst]
    uses: entur/gha-helm/.github/workflows/lint.yml@v1
    with:
      chart: helm/wayfare
      environment: ${{ matrix.environment }}
      values: values-kub-ent-${{ matrix.environment }}.yaml

  # The build that actually ships -- one per merge, not per PR push.
  docker-build:
    needs:
      - docker-lint
      - helm-lint
    permissions:
      contents: read
      id-token: write
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      context: clients/tanstack-start
      dockerfile: clients/tanstack-start/Dockerfile
      image_name: wayfare

  docker-scan:
    needs: docker-build
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      security-events: write
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    secrets: inherit
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  docker-push:
    needs:
      - docker-build
      - docker-scan
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: entur/gha-docker/.github/workflows/push.yml@v1
    secrets: inherit
    with:
      image_name: wayfare
      git_tag: true

  # Not guaranteed stable, points at upstream dev services.
  deploy-dev:
    needs: docker-push
    permissions:
      contents: read
      id-token: write
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    secrets: inherit
    with:
      chart: helm/wayfare
      environment: dev
      image: ${{ needs.docker-push.outputs.image_and_tag }}
      namespace: wayfare
      release_name: wayfare
      values: values-kub-ent-dev.yaml

  promotion-summary:
    needs: docker-push
    runs-on: ubuntu-24.04
    steps:
      - name: Print the tst promotion command
        run: |
          {
            echo "Pushed \`${{ needs.docker-push.outputs.image_and_tag }}\`."
            echo ""
            echo "To promote it to tst: Actions -> Deploy Wayfare tst -> Run workflow, with image = \`${{ needs.docker-push.outputs.image_and_tag }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
