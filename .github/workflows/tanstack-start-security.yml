name: TanStack Start Security

on:
  pull_request:
    paths:
      - "clients/tanstack-start/**"
      - "helm/wayfare/**"
      - ".github/workflows/tanstack-start-security.yml"

permissions:
  contents: read

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/tanstack-start

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
        with:
          version: 11.13.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: clients/tanstack-start/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit (high/critical)
        run: pnpm audit --audit-level high --ignore GHSA-rmmr-r34h-pfm5

  docker:
    name: Docker lint, build, and scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: clients/tanstack-start/Dockerfile

      - name: Build image without credentials
        run: >-
          docker build
          --file clients/tanstack-start/Dockerfile
          --tag wayfare:ci
          clients/tanstack-start

      - name: Scan image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: wayfare:ci
          fail-build: true
          severity-cutoff: high

  helm-lint:
    name: Helm lint
    uses: entur/gha-helm/.github/workflows/lint.yml@v1
    with:
      chart: helm/wayfare
      environment: tst
      values: values-kub-ent-tst.yaml
