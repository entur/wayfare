name: TanStack Start Security

on:
  pull_request:
    paths:
      - "clients/tanstack-start/**"
      - ".github/workflows/tanstack-start-security.yml"
  push:
    branches:
      - main
    paths:
      - "clients/tanstack-start/**"
      - ".github/workflows/tanstack-start-security.yml"

permissions:
  contents: read

jobs:
  tanstack-start-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/tanstack-start

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.13.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: clients/tanstack-start/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit (high/critical)
        run: pnpm audit --audit-level high --ignore GHSA-rmmr-r34h-pfm5
