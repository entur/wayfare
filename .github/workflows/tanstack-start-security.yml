name: TanStack Start Security

on:
  pull_request:
    paths:
      - "clients/tanstack-start/**"
      - ".github/workflows/tanstack-start-security.yml"

permissions:
  contents: read

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/tanstack-start

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
        with:
          version: 11.13.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: clients/tanstack-start/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit (high/critical)
        run: pnpm audit --audit-level high --ignore GHSA-rmmr-r34h-pfm5

  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
    with:
      dockerfile: clients/tanstack-start/Dockerfile

  # Build and scan only, no push -- avoids pushing an image per PR commit.
  docker-build:
    needs:
      - docker-lint
    permissions:
      contents: read
      id-token: write
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      context: clients/tanstack-start
      dockerfile: clients/tanstack-start/Dockerfile
      image_name: wayfare

  docker-scan:
    needs: docker-build
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      security-events: write
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    secrets: inherit
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}
