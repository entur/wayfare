[project]
name = "omsa_demo_bff"
version = "0.1.0"
description = "FastAPI backend-for-frontend for the OMSA travel Flutter demo"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn[standard]>=0.52.1,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "cachetools>=7.1.7,<8.0.0",
]

[project.urls]
Homepage = "https://github.com/entur/omsa-example-clients"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "anyio>=4.4.0,<5.0.0",
    "pygments>=2.20.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8000
reload = true
